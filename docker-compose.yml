services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lumior
      POSTGRES_PASSWORD: lumior
      POSTGRES_DB: lumior
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumior -d lumior"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
